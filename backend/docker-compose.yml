version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voicecall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voicecall_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voicecall_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicecall-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/voicecall_db?schema=public"
      JWT_ACCESS_SECRET: "prod-jwt-access-secret-key-32-chars-long-min"
      JWT_ACCESS_EXPIRATION: "15m"
      JWT_REFRESH_SECRET: "prod-jwt-refresh-secret-key-32-chars-long-min"
      JWT_REFRESH_EXPIRATION: "30d"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_PATH: "/app/uploads"
      STORAGE_PUBLIC_URL: "http://localhost:3000/uploads"
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
